name: OrderLab Python CI-CD

# 사용자의 실습 방식: PR 없이 push에서 검사
on: push

# 기본 권한은 저장소 읽기만 허용
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2026-11-20
    steps:
      # 실행 환경에 저장소 코드를 가져옴
      - uses: actions/checkout@v7
      # 실행 환경에서 Python 3.14를 사용하도록 준비
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      # CI에서는 파일 자동 수정 없이 검사만 수행
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Linux와 Windows에서 같은 테스트를 각각 실행
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 2026-11-20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Test with coverage
        run: python -m pytest -q --cov=orderlab --cov-report=xml
      # 운영체제별 이름을 달리해 artifact 충돌 방지
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: 2026-11-20/coverage.xml
          if-no-files-found: ignore

  deploy:
    # lint와 모든 OS 테스트가 통과한 main push에서만 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: 2026-11-20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Python으로 HTML 생성 후 Pages artifact로 올리고 배포
      - run: python generate_report.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./2026-11-20/site
      - id: deployment
        uses: actions/deploy-pages@v4
