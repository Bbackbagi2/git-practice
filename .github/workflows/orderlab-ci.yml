name: OrderLab Python CI

on: push

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2026-11-20
    steps:
      # 저장소 코드를 실행 환경에 가져옴
      # requirements-dev.txt와 테스트 파일을 사용하는 단계보다 먼저 필요
      - uses: actions/checkout@v7
      # Python 3.14를 준비 (checkout과의 순서는 바뀌어도 됨)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
