name: OrderLab Python CI

# push할 때 품질 검사 실행
on: push

# 저장소 내용을 읽는 권한만 부여
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # run 명령을 날짜별 실습 폴더에서 실행
    defaults:
      run:
        working-directory: 2026-11-20
    steps:
      # 저장소 코드를 실행 환경에 가져옴
      # requirements-dev.txt와 테스트 파일을 사용하는 단계보다 먼저 필요
      - uses: actions/checkout@v7
      # Python 3.14를 준비 (checkout과의 순서는 바뀌어도 됨)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # 의존성 설치 → 정적 검사 → 포맷 검사 → 테스트
      # CI에서는 --fix 없이 검사만 수행
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
