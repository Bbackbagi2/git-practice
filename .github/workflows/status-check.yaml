# 상태 확인 함수 = if에서 앞선 실행 상태를 확인
# success() = 같은 job에서 앞선 모든 step 성공이면 true
# failure() = 같은 job에서 앞선 step 중 실패가 있으면 true
# always() = 항상 true / 실패, 취소 상태에서도 실행
# cancelled() = 워크플로가 취소됐으면 true
# 상태 확인 함수를 생략한 if = 기본 success() 조건 적용
# 이 실습 = exit 1로 의도적 실패 / 이후 상태별 실행 확인
# 예상 전체 결과 = failure / 뒤의 오류 처리 step 성공 후에도 앞선 실패 기록 유지
# 아래 결과 = 취소하지 않고 일반 수동 실행했을 때의 예상값
name: Status Functions Example
on: workflow_dispatch
jobs:
  status-test:
    runs-on: ubuntu-latest
    steps:
      # 1. 정상 실행 / 예상 success
      - name: Normal Step
        run: echo "Normal execution"

      # 2. 앞선 step 전부 성공 / success() = true / 예상 success
      - name: Success Test
        if: ${{ success() }}
        run: echo "Previous steps succeeded"

      # 3. exit 1 = 실패 종료 코드 / 예상 failure
      - name: Fail Step
        run: exit 1

      # 4. Fail Step 실패 기록 존재 / failure() = true / 예상 success
      - name: Failure Test
        if: ${{ failure() }}
        run: echo "A previous step failed"

      # 5. 앞선 실패 기록 유지 / success() = false / 예상 skipped
      - name: Success After Failure
        if: ${{ success() }}
        run: echo "All steps succeeded"

      # 6. always() = true / 앞선 실패 후에도 실행 / 예상 success
      - name: Always Test
        if: ${{ always() }}
        run: echo "Always executed"

      # 7. 취소하지 않은 실행 / cancelled() = false / 예상 skipped
      - name: Cancelled Test
        if: ${{ cancelled() }}
        run: echo "Workflow was cancelled"
