# 해시 = 데이터를 일정한 규칙으로 계산한 요약값
# 해시 함수 = 입력 데이터를 해시값으로 바꾸는 계산 규칙
# SHA-256 = 입력 크기와 관계없이 256비트, 보통 16진수 64자리
# 특징 = 같은 입력 + 같은 알고리즘 = 같은 결과
# 작은 변경에도 민감 = 공백, 줄바꿈 포함 내용 변화에 따라 해시값 크게 변화
# 암호학적 해시 = 원본 역산 및 같은 해시의 다른 입력 찾기 어렵게 설계
# 충돌 = 다른 데이터가 같은 해시를 가질 가능성 존재
# 무결성 = 데이터가 의도한 상태 그대로 보존된 성질
# 무결성 검사 = 신뢰할 수 있는 기준 해시 보관, 재계산, 비교
# 같은 해시 = 동일한 내용이라는 강한 근거 / 다른 해시 = 내용 변경
# 변경 위치 확인 = 파일 비교 필요
# 기준값 출처 신뢰 필요 / 파일과 기준값 동시 변조 시 단순 비교 통과 가능
# 작성자, 출처 검증 = 전자서명 또는 HMAC 등 추가 수단 활용
on: workflow_dispatch
jobs:
  hash-functions:
    runs-on: ubuntu-latest
    steps:
      # uses = 저장소 파일을 runner 작업공간으로 가져오기
      - uses: actions/checkout@v5
      - env:
          # *.yaml = workflows 바로 아래 .yaml 파일 전체
          # 일치하는 파일 없음 = hashFiles() 결과는 빈 문자열 ''
          RESULT_YAML: "${{ hashFiles('.github/workflows/*.yaml') }}"
        # run으로 수정하기 전 파일 집합의 해시
        run: echo "BEFORE_YAML=[$RESULT_YAML]"
      # run = runner의 hash.yaml에 주석 한 줄 추가
      # hash.yaml도 *.yaml 대상에 포함 / 같은 실행 안에서 수정 전후 비교
      - run: |
          echo '# hash comparison test' >> .github/workflows/hash.yaml
      - env:
          RESULT_YAML: "${{ hashFiles('.github/workflows/*.yaml') }}"
        # 수정 후 해시 / 파일 내용이 달라지면 해시도 달라짐
        run: echo "AFTER_YAML=[$RESULT_YAML]"
