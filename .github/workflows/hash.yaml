# 해시 = 데이터를 일정한 규칙으로 계산한 요약값
# 해시 함수 = 입력 데이터를 해시값으로 바꾸는 계산 규칙
# SHA-256 = 입력 크기와 관계없이 256비트, 보통 16진수 64자리
# 특징 = 같은 입력 + 같은 알고리즘 = 같은 결과
# 작은 변경에도 민감 = 공백, 줄바꿈 포함 내용 변화에 따라 해시값 크게 변화
# 암호학적 해시 = 원본 역산 및 같은 해시의 다른 입력 찾기 어렵게 설계
# 충돌 = 다른 데이터가 같은 해시를 가질 가능성 존재
# 무결성 = 데이터가 의도한 상태 그대로 보존된 성질
# 무결성 검사 = 신뢰할 수 있는 기준 해시 보관, 재계산, 비교
# 같은 해시 = 동일한 내용이라는 강한 근거 / 다른 해시 = 내용 변경
# 변경 위치 확인 = 파일 비교 필요
# 기준값 출처 신뢰 필요 / 파일과 기준값 동시 변조 시 단순 비교 통과 가능
# 작성자, 출처 검증 = 전자서명 또는 HMAC 등 추가 수단 활용
# 실행 순서와 결과 기록
# 1) checkout 없이 해시 계산 / c50b18c / Actions 43340725888
# 결과 RESULT_YAML=[] / 작업공간에 대상 파일 없음
# 2) checkout 추가 후 해시 계산 / cdbdb73 / Actions 43341097370
# 결과 RESULT_YAML = 64자리 해시 / 저장소 파일 사용 가능
# 3) checkout, 수정 전 해시, run으로 주석 추가, 수정 후 해시
# 4e962aa / Actions 43341245417 / BEFORE_YAML과 AFTER_YAML이 서로 다름
# 수정 대상 = runner의 hash.yaml / 주석 한 줄도 파일 내용 변경
# 4) checkout, sample.txt 생성 run, Hash Test, GitHub File Hash
# ad8ce51 / Actions 43341432051 / 모든 단계 성공
# RESULT_HASH = RESULT_ALL / 당시 *.txt 대상은 sample.txt 하나
# RESULT_MISSING = 빈 문자열 / RESULT_YAML = 64자리 해시
# hash.yaml 자체도 해시 대상 / 커밋별 내용 변경으로 기준값도 변경
# run의 수정 효과 비교 = 3번 실행 내부의 수정 전후 값 사용

on: workflow_dispatch
jobs:
  hash-functions:
    runs-on: ubuntu-latest
    steps:
      # 먼저 저장소 파일을 runner 작업공간에 가져오기
      - uses: actions/checkout@v5

      # checkout 다음에 파일 생성 / echo가 마지막 줄바꿈도 추가
      - name: Create Sample File
        run: |
          echo "Hello GitHub Actions" > sample.txt

      # 생성한 파일이 존재하는 상태에서 해시 계산
      - name: Hash Test
        env:
          # sample.txt 한 파일의 해시
          RESULT_HASH: "${{ hashFiles('sample.txt') }}"
          # *.txt에 sample.txt 하나만 해당하면 RESULT_HASH와 같은 값
          RESULT_ALL: "${{ hashFiles('*.txt') }}"
          # 파일 없음 = 빈 문자열
          RESULT_MISSING: "${{ hashFiles('missing.txt') }}"
        run: printenv | grep '^RESULT_' | sort

      - name: GitHub File Hash
        env:
          # checkout으로 받은 workflows 바로 아래 .yaml 파일 집합의 해시
          # sample.txt는 이 패턴에 포함되지 않음
          RESULT_YAML: "${{ hashFiles('.github/workflows/*.yaml') }}"
        run: printenv | grep '^RESULT_'
