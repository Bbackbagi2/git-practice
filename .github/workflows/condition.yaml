# if = step 또는 job의 실행 조건 / true면 실행, false면 건너뜀
# github.run_id = 워크플로 실행 ID / 문자열에 '1' 포함 여부 검사
# contains(문자열, 찾을 값) = 포함 여부 / ! = 논리 부정
# 실행 ID에 '1' 포함 = Hello / 포함하지 않음 = Goodbye
# 현재 공식 문서 예시 순서 = name, if, run
# 같은 step 안의 속성 작성 순서 = 조건 판정 결과에 영향 없음
# !로 시작하는 조건식 = ${{ ... }}로 감싸 YAML의 ! 표기와 구분
#
# 이전 실행 기록 = Actions 43342385253 / 전체 성공
# 실행 ID에 '1' 없음 / contains(github.run_id, '1') = false
# Print Hello = 조건 false / skipped / Hello 출력 건너뜀
# Print Goodbye = !false가 true / Goodbye 출력 / success
# 당시 Goodbye 속성 순서 = run, if / 이번에는 if, run으로 정렬
# 새 실행 결과 = 해당 실행 ID에 '1'이 있는지 다시 판정
name: Conditional Example
on: workflow_dispatch
jobs:
  conditional:
    runs-on: ubuntu-latest
    steps:
      # 현재 실행 ID 출력 / 아래 분기 결과를 확인할 기준값
      - name: Show Run ID
        run: echo "Run ID = ${{ github.run_id }}"

      # if 먼저 작성 / 실행 ID에 '1'이 있으면 true, Hello 출력
      - name: Print Hello
        if: ${{ contains(github.run_id, '1') }}
        run: echo "Hello"

      # if 먼저 작성 / !contains는 '1'이 없으면 true, Goodbye 출력
      - name: Print Goodbye
        if: ${{ !contains(github.run_id, '1') }}
        run: echo "Goodbye"
