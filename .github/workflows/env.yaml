name: Environment Variables Demo # 비교할 블록 수준 단위: Job, Step, Workflow;GitHub Actions 에서 환경 변수는 Workflow, Job, Step 단위로 설정 가능. Workflow 단위 환경 변수는 모든 Job과 Step에서 사용 가능, Job 단위 환경 변수는 해당 Job의 모든 Step에서 사용 가능, Step 단위 환경 변수는 해당 Step에서만 사용 가능.
on: workflowdispatch
env: # 환경 변수 설정
  APP_NAME: "MyApplication" # APP_NAME 환경 변수 설정
jobs:
  test: #runner name id (사용자 정의)
    runs-on: ubuntu-latest

    env:
    APP_VERSION: "1.0" # job 단위 환경 변수 설정

    steps: 
      - name: Print Variables
        env: 
          MESSAGE: Hello GitHub Actions # step 단위 환경 변수 설정
        run: |
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION"
          echo "Message: $MESSAGE"

      - name: Print Again
        run: | #runner 단위(block) 1행 2행 / step 단위(block) 3행.
          echo "Application: $APP_NAME"
          echo "Version: $APP_VERSION" 
          echo "Message: $MESSAGE" 
      - name: Env Overwite
        env:
          APP_NAME: MyApplication v2 # step 단위 환경 변수 설정, job 단위 환경 변수 덮어쓰기
        run: |
          echo "Application: $APP_NAME"
      - name: Default Envs
        run: echo "$GITHUB_REPOSITORY"